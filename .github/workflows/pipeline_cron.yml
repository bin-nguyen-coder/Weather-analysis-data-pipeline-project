# =============================================================================
# Weather Pipeline - daily scheduled run
#
# Triggers the full pipeline every day at 02:00 UTC (and on demand via
# workflow_dispatch). A PostgreSQL service container plays the role of the
# warehouse; database settings are provided through the standard PG* env
# variables, which Workflow/config.py merges over workflow_config.json.
# =============================================================================

name: Weather Pipeline Daily Run

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGDATABASE: weather
  PGUSER: weather_user
  PGPASSWORD: weather_password
  PYTHONUNBUFFERED: "1"

jobs:
  run-pipeline:
    name: Execute weather pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weather
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_user -d weather"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tenacity psycopg2-binary pandas numpy \
                      scikit-learn tensorflow matplotlib seaborn

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if python -c "import psycopg2; psycopg2.connect(host='127.0.0.1',port=5432,dbname='weather',user='weather_user',password='weather_password').close()"; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Run pipeline end-to-end
        run: python "Automation Pipeline/run_pipeline.py"

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-pipeline-artifacts
          path: |
            Forecast/forecast.json
            EDA/reports/*.png
            EDA/reports/summary_statistics.json
            Model/lstm_weather_model.h5
            Model/scaler.pkl
            data/pipeline_run.json
          if-no-files-found: warn
          retention-days: 14
